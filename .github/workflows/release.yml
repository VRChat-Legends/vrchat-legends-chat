# Builds VRChat Legends Chat for Windows and Linux, signs the update artifacts, and publishes a
# GitHub release with the installers plus latest.json (the file the app reads to update itself).
#
# Roll out a version: bump "version" in src-tauri/tauri.conf.json, then push a tag that matches,
# e.g.  git tag v0.1.0 && git push origin v0.1.0
# The release is created as a DRAFT. Open the Releases page and publish it to send it to everyone
# (the app only updates to the "latest" published, non-prerelease release).
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install the Tauri CLI
        run: npm ci

      - name: Rust tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'VRChat Legends Chat __VERSION__'
          releaseBody: 'Download the installer for your system below. After this version, the app updates itself.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
