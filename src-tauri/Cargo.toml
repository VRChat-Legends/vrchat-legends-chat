[package]
name = "vrcl-chat"
version = "0.1.0"
description = "VRChat Legends Chat for Windows and Linux"
authors = ["VRChat Legends"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
open = "5"
# tauri::generate_context! expands to code that uses serde_json, so it must be a direct dependency
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
